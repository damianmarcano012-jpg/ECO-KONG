<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>ECO KONG 2030 - Misión Agenda Sostenible</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #arcade-cabinet {
            position: relative;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #0a0a0d;
            border: 4px solid #b91c1c;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 0 35px rgba(220, 38, 38, 0.25), inset 0 0 20px rgba(0,0,0,0.9);
        }
        #canvas-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 4.35;
            max-height: 71vh;
            background: #000000;
            border: 3px solid #262626;
            border-radius: 6px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        /* Efecto sutil de líneas CRT arcade */
        .crt-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }
        .arcade-btn {
            background: linear-gradient(180deg, #262626 0%, #141414 100%);
            border: 2px solid #525252;
            border-bottom-width: 5px;
            border-radius: 10px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            transition: transform 0.05s, border-bottom-width 0.05s;
        }
        .arcade-btn:active, .arcade-btn.active {
            transform: translateY(3px);
            border-bottom-width: 2px;
            background: #333333;
        }
        .jump-btn {
            background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
            border-color: #f87171;
        }
        .jump-btn:active, .jump-btn.active {
            background: #ef4444;
        }
        select.arcade-select {
            background: #171717;
            color: #facc15;
            border: 1px solid #525252;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 4px 6px;
            border-radius: 4px;
            outline: none;
        }
    </style>
</head>

// 1. MOTOR DE SONIDO CHIPTUNE 8-BITS AUTÉNTICO (WEB AUDIO API)
// ----------------------------------------------------------------------------
class RetroAudio {
    constructor() {
        this.ctx = null;
        this.sfxEnabled = true;
        this.musicEnabled = true;
        this.bgmInterval = null;
        this.bgmStep = 0;
        this.isPowerMode = false;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playTone(freq, type, duration, vol = 0.12, slideTo = null) {
        if (!this.sfxEnabled || !this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slideTo) {
                osc.frequency.exponentialRampToValueAtTime(slideTo, this.ctx.currentTime + duration);
            }
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
    }

    playHowHighJingle() {
        if (!this.sfxEnabled && !this.musicEnabled) return;
        const notes = [
            { f: 392.00, d: 0.11, t: 0 },
            { f: 329.63, d: 0.11, t: 120 },
            { f: 261.63, d: 0.11, t: 240 },
            { f: 293.66, d: 0.11, t: 360 },
            { f: 329.63, d: 0.11, t: 480 },
            { f: 261.63, d: 0.28, t: 600 }
        ];
        notes.forEach(n => {
            setTimeout(() => this.playToneRaw(n.f, 'square', n.d, 0.11), n.t);
        });
    }

    playJump() {
        this.playTone(190, 'square', 0.24, 0.12, 540);
    }

    playStep() {
        const stepFreq = (this.bgmStep % 2 === 0) ? 145 : 175;
        this.playTone(stepFreq, 'triangle', 0.035, 0.07);
    }

    playClimb() {
        this.playTone(290, 'triangle', 0.04, 0.06, 360);
    }

    playRivet() {
        this.playTone(587.33, 'square', 0.07, 0.12);
        setTimeout(() => this.playTone(880.00, 'square', 0.12, 0.12), 65);
    }

    playCollect() {
        this.playTone(523.25, 'square', 0.07, 0.12);
        setTimeout(() => this.playTone(659.25, 'square', 0.07, 0.12), 65);
        setTimeout(() => this.playTone(783.99, 'square', 0.14, 0.12), 130);
    }

    playPowerUp() {
        const notes = [330, 392, 659, 523, 587, 784];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 'square', 0.08, 0.12), i * 60);
        });
    }

    playSmash() {
        this.playTone(140, 'sawtooth', 0.18, 0.18, 45);
        setTimeout(() => this.playTone(480, 'square', 0.12, 0.12, 920), 75);
    }

    playScoreBarrel() {
        this.playTone(620, 'square', 0.08, 0.1, 930);
    }

    playHit() {
        const notes = [330, 277, 220, 165, 110];
        notes.forEach((n, i) => {
            setTimeout(() => this.playTone(n, 'sawtooth', 0.14, 0.15), i * 95);
        });
    }

    playWinLevel() {
        const melody = [
            { f: 392, d: 0.11 }, { f: 523, d: 0.11 }, { f: 659, d: 0.11 },
            { f: 784, d: 0.24 }, { f: 659, d: 0.11 }, { f: 1046, d: 0.42 }
        ];
        let time = 0;
        melody.forEach(m => {
            setTimeout(() => this.playTone(m.f, 'square', m.d, 0.13), time);
            time += m.d * 1000;
        });
    }

    startBGM() {
        this.stopBGM();
        if (!this.musicEnabled) return;
        const dkBass = [130.81, 130.81, 146.83, 164.81, 130.81, 130.81, 164.81, 146.83];
        const hammerTheme = [523.25, 659.25, 783.99, 659.25, 587.33, 783.99, 880.00, 783.99];

        this.bgmInterval = setInterval(() => {
            if (!this.musicEnabled || !this.ctx || this.ctx.state !== 'running') return;
            if (gameState !== 'PLAYING') return;

            if (this.isPowerMode) {
                const freq = hammerTheme[this.bgmStep % hammerTheme.length];
                this.playToneRaw(freq, 'square', 0.10, 0.06);
            } else {
                const freq = dkBass[this.bgmStep % dkBass.length];
                this.playToneRaw(freq, 'triangle', 0.15, 0.065);
            }
            this.bgmStep++;
        }, 220);
    }

    playToneRaw(freq, type, duration, vol) {
        if (!this.ctx) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(vol, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
    }

    stopBGM() {
        if (this.bgmInterval) {
            clearInterval(this.bgmInterval);
            this.bgmInterval = null;
        }
    }
}

const keys = { left: false, right: false, up: false, down: false, jump: false };

window.addEventListener('keydown', e => {
    audio.init();
    if (['ArrowLeft', 'KeyA'].includes(e.code)) { keys.left = true; e.preventDefault(); }
    if (['ArrowRight', 'KeyD'].includes(e.code)) { keys.right = true; e.preventDefault(); }
    if (['ArrowUp', 'KeyW'].includes(e.code)) { keys.up = true; e.preventDefault(); }
    if (['ArrowDown', 'KeyS'].includes(e.code)) { keys.down = true; e.preventDefault(); }
    if (['Space', 'KeyK'].includes(e.code)) {
        if (!keys.jump) triggerJump();
        keys.jump = true;
        e.preventDefault();
    }
    if (e.code === 'Enter' && (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'VICTORY')) {
        startGame();
    }
});

window.addEventListener('keyup', e => {
    if (['ArrowLeft', 'KeyA'].includes(e.code)) keys.left = false;
    if (['ArrowRight', 'KeyD'].includes(e.code)) keys.right = false;
    if (['ArrowUp', 'KeyW'].includes(e.code)) keys.up = false;
    if (['ArrowDown', 'KeyS'].includes(e.code)) keys.down = false;
    if (['Space', 'KeyK'].includes(e.code)) keys.jump = false;
});

// Enlace de botones táctiles
function bindTouchButton(id, keyName) {
    const btn = document.getElementById(id);
    if (!btn) return;
    const pressOn = (e) => {
        e.preventDefault();
        audio.init();
        if (keyName === 'jump') {
            if (!keys.jump) triggerJump();
            keys.jump = true;
        } else {
            keys[keyName] = true;
        }
        btn.classList.add('active');
    };
    const pressOff = (e) => {
        e.preventDefault();
        if (keyName === 'jump') keys.jump = false;
        else keys[keyName] = false;
        btn.classList.remove('active');
    };
    btn.addEventListener('touchstart', pressOn, { passive: false });
    btn.addEventListener('touchend', pressOff, { passive: false });
    btn.addEventListener('mousedown', pressOn);
    btn.addEventListener('mouseup', pressOff);
}

bindTouchButton('ctrl-left', 'left');

// ----------------------------------------------------------------------------
// 6. FUNCIONES AUXILIARES DE FÍSICA Y GEOMETRÍA DE VIGAS
// ----------------------------------------------------------------------------
function getGirderYAt(g, x) {
    if (x < Math.min(g.x1, g.x2) - 2 || x > Math.max(g.x1, g.x2) + 2) return null;
    const t = (x - g.x1) / (g.x2 - g.x1 || 1);
    return g.y1 + t * (g.y2 - g.y1);
}

function getGirderSlope(g) {
    return (g.y2 - g.y1) / (g.x2 - g.x1 || 1);
}

function startGame() {
    audio.init();
    score = 0;
    lives = 3;
    loadLevel(currentLevel);
    audio.startBGM();
}

function loadLevel(lvlIndex) {
    currentLevel = lvlIndex;
    document.getElementById('level-selector').value = currentLevel;
    levelData = LEVELS[currentLevel % LEVELS.length];

    resetPlayerPosition();
    barrels = [];
    smokeEnemies = [];
    fireEnemies = [];
    droneEnemies = [];
    floatingTexts = [];
    particles = [];
    bonusTimer = 5000;
    villainAnimTimer = 0;
    villainState = 'IDLE';
    audio.isPowerMode = false;

    const bottomGirder = levelData.girders[0];
    const drumX = player.x > W / 2 ? 28 : W - 52;
    const drumY = getGirderYAt(bottomGirder, drumX + 12) || 486;
    oilDrum = { x: drumX, y: drumY - 30, w: 24, h: 30, litTimer: 120 };

    const sCount = levelData.smokeCount || 0;
    for (let i = 0; i < sCount; i++) {
        smokeEnemies.push({
            x: 95 + i * 115,
            y: 205 + (i % 3) * 85,
            vx: (i % 2 === 0 ? 1 : -1) * (1.0 + lvlIndex * 0.05),
            w: 24,
            h: 16
        });
    }

    const fCount = levelData.fireCount || 0;
    for (let i = 0; i < fCount; i++) {
        const gIdx = Math.min(levelData.girders.length - 2, 1 + (i % Math.max(1, levelData.girders.length - 2)));
        const g = levelData.girders[gIdx];
        const spawnX = (g.x1 + g.x2) / 2 + (i % 2 === 0 ? -40 : 40);
        const spawnY = getGirderYAt(g, spawnX) || 390;
        fireEnemies.push({
            x: spawnX - 9,
            y: spawnY - 18,
            w: 18,
            h: 18,
            vx: (i % 2 === 0 ? 1 : -1) * (1.05 + lvlIndex * 0.04),
            climbing: false,
            climbDir: 0,
            targetY: 0,
            ladderCooldown: 40
        });
    }

    const dCount = levelData.droneCount || 0;
    for (let i = 0; i < dCount; i++) {
        droneEnemies.push({
            x: 120 + i * 180,
            baseY: 145 + i * 115,
            y: 145 + i * 115,
            vx: (i % 2 === 0 ? 1.25 : -1.25),
            phase: i * 1.5,
            w: 22,
            h: 14
        });
    }

    gameState = 'LEVEL_INTRO';
    stateTimer = 140;
    audio.playHowHighJingle();
}

function resetPlayerPosition() {
    player.x = levelData.playerStart.x;
    player.y = levelData.playerStart.y;
    player.vx = 0;
    player.vy = 0;
    player.onGround = true;
    player.onLadder = false;
    player.climbing = false;
}

function triggerJump() {
    if (gameState === 'PLAYING' && player.onGround && !player.onLadder && !player.climbing) {
        player.vy = player.jumpForce;
        player.onGround = false;
        audio.playJump();
    }
}

function addScore(amount, x, y, text) {
    score += amount;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('ecokong_highscore', highScore);
    }
    floatingTexts.push({ text: text || `+${amount}`, x, y, life: 45 });
}

function spawnParticles(x, y, color, count = 10) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4.5,
            vy: (Math.random() - 0.5) * 4.5,
            color,
            life: 30
        });
    }
}

function triggerPlayerHit() {
    lives--;
    audio.playHit();
    spawnParticles(player.x + 8, player.y + 11, '#ef4444', 20);
    if (lives <= 0) {
        gameState = 'GAME_OVER';
    } else {
        resetPlayerPosition();
        player.invulnTimer = 120;
    }
}

// ----------------------------------------------------------------------------
// 7. LÓGICA DE ACTUALIZACIÓN DEL JUEGO
// ----------------------------------------------------------------------------
function update() {
    frameCount++;

    if (gameState === 'LEVEL_INTRO') {
        stateTimer--;
        if (stateTimer <= 0) {
            gameState = 'PLAYING';
        }
        return;
    }

    if (gameState === 'START' || gameState === 'GAME_OVER' || gameState === 'VICTORY') {
        return;
    }

    if (gameState === 'LEVEL_CLEAR') {
        stateTimer--;
        if (stateTimer <= 0) {
            currentLevel++;
            if (currentLevel >= LEVELS.length) {
                gameState = 'VICTORY';
            } else {
                loadLevel(currentLevel);
            }
        }
        return;
    }

    // Temporizador de bonificación decreciente
    bonusTickCounter++;
    if (bonusTickCounter >= 30 && bonusTimer > 0) {
        bonusTimer -= 100;
        bonusTickCounter = 0;
        if (bonusTimer <= 0) {
            triggerPlayerHit();
        }
    }

    if (player.invulnTimer > 0) player.invulnTimer--;

    updateElevators();
    updatePlayer();
    updateVillainAndBarrels();
    updateFireEnemies();
    updateSmokeEnemies();
    updateDroneEnemies();
    updateCollectiblesAndPowerUps();
    updateEffects();
}

function updateElevators() {
    if (!levelData.elevators) return;
    for (const el of levelData.elevators) {
        el.y += el.vy;
        if (el.y <= el.minY || el.y >= el.maxY) {
            el.vy = -el.vy;
            el.y = Math.max(el.minY, Math.min(el.maxY, el.y));
        }
    }
}

function updatePlayer() {
    const pCenter = player.x + player.w / 2;
    const pBottom = player.y + player.h;

    // Comprobación de escaleras
    let nearLadder = false;
    let currentLadder = null;

    for (const lad of levelData.ladders) {
        if (pCenter >= lad.x - 6 && pCenter <= lad.x + 6 && pBottom >= lad.topY - 4 && player.y <= lad.bottomY + 4) {
            nearLadder = true;
            currentLadder = lad;
            break;
        }
    }

    if (nearLadder && (keys.up || keys.down)) {
        player.climbing = true;
        player.onLadder = true;
        player.onGround = false;
        player.vy = 0;
    }

    if (player.climbing) {
        if (keys.up) {
            player.y -= 2.1;
            if (frameCount % 12 === 0) audio.playClimb();
        }
        if (keys.down) {
            player.y += 2.1;
            if (frameCount % 12 === 0) audio.playClimb();
        }

        if (currentLadder) {
            player.x += (currentLadder.x - (player.x + player.w / 2)) * 0.3;
        }

        // Salir de la escalera por arriba o por abajo
        if (currentLadder && (player.y + player.h < currentLadder.topY - 2 || player.y > currentLadder.bottomY)) {
            player.climbing = false;
            player.onLadder = false;
            if (player.y + player.h < currentLadder.topY) {
                player.y = currentLadder.topY - player.h;
                player.onGround = true;
            }
        }
        if (!nearLadder) {
            player.climbing = false;
            player.onLadder = false;
        }
    } else {
        // Movimiento horizontal en suelo o salto
        if (keys.left) {
            player.vx = -player.speed;
            player.facing = -1;
            if (player.onGround && frameCount % 14 === 0) audio.playStep();
        } else if (keys.right) {
            player.vx = player.speed;
            player.facing = 1;
            if (player.onGround && frameCount % 14 === 0) audio.playStep();
        } else {
            player.vx = 0;
        }

        player.x += player.vx;
        player.x = Math.max(20, Math.min(W - 20 - player.w, player.x));

        // Gravedad y plataformas / vigas
        player.vy += 0.38;
        player.y += player.vy;

        let landed = false;
        const newBottom = player.y + player.h;
        const newCenterX = player.x + player.w / 2;

        for (const g of levelData.girders) {
            if (newCenterX >= g.x1 && newCenterX <= g.x2) {
                const gy = getGirderYAt(g, newCenterX);
                if (gy !== null && pBottom <= gy + 6 && newBottom >= gy - 2 && player.vy >= 0) {
                    player.y = gy - player.h;
                    player.vy = 0;
                    player.onGround = true;
                    landed = true;
                    break;
                }
            }
        }

        // Soporte en elevadores móviles
        if (!landed && levelData.elevators) {
            for (const el of levelData.elevators) {
                if (player.x + player.w > el.x && player.x < el.x + el.w && pBottom <= el.y + 6 && newBottom >= el.y - 4 && player.vy >= 0) {
                    player.y = el.y - player.h;
                    player.vy = el.vy;
                    player.onGround = true;
                    landed = true;
                    break;
                }
            }
        }

        if (!landed) {
            player.onGround = false;
        }
    }

    // Comprobar victoria o llegada a la princesa / objetivo ODS
    const goal = levelData.goalPos;
    if (Math.abs(player.x - goal.x) < 22 && Math.abs(player.y - goal.y) < 22) {
        audio.playWinLevel();
        addScore(bonusTimer, player.x, player.y - 20, `BONUS +${bonusTimer}`);
        gameState = 'LEVEL_CLEAR';
        stateTimer = 160;
    }
}

function updateVillainAndBarrels() {
    villainAnimTimer++;
    if (oilDrum.litTimer > 0) oilDrum.litTimer--;
    const interval = levelData.barrelInterval;

    if (villainAnimTimer === interval - 22) {
        villainState = 'THROWING';
    } else if (villainAnimTimer >= interval) {
        villainAnimTimer = 0;
        villainState = 'IDLE';

        const centerVillain = levelData.villainPos.x > 160;
        const dir = centerVillain ? (Math.random() < 0.5 ? -1 : 1) : 1;
        const isBlueOil = Math.random() < 0.32;

        const spawnX = levelData.villainPos.x + (dir === 1 ? 42 : 4);
        let spawnY = levelData.villainPos.y + 34;
        for (const g of levelData.girders) {
            const gy = getGirderYAt(g, spawnX);
            if (gy !== null && Math.abs(gy - (levelData.villainPos.y + 46)) < 25) {
                spawnY = gy - 10;
                break;
            }
        }

        barrels.push({
            x: spawnX,
            y: spawnY,
            r: 10,
            vx: dir * (isBlueOil ? 2.35 : 1.9),
            vy: 0,
            onGirder: true,
            currentGirder: null,
            fallingLadder: false,
            targetLadderY: 0,
            ladderCooldown: 25,
            blue: isBlueOil,
            jumpedOver: false,
            rot: 0,
            lastX: spawnX,
            lastY: spawnY,
            stuckTicks: 0
        });
    }

    const pCenter = player.x + player.w / 2;
    const pBottom = player.y + player.h;

    for (let i = barrels.length - 1; i >= 0; i--) {
        const b = barrels[i];
        b.rot += b.vx * 0.14;
        if (b.ladderCooldown > 0) b.ladderCooldown--;

        if (Math.hypot(b.x - b.lastX, b.y - b.lastY) < 0.35) {
            b.stuckTicks++;
            if (b.stuckTicks > 35) {
                b.fallingLadder = false;
                b.onGirder = false;
                b.currentGirder = null;
                b.y += 6;
                b.vy = 2.5;
                b.vx = (b.x < W / 2) ? 2.1 : -2.1;
                b.stuckTicks = 0;
            }
        } else {
            b.stuckTicks = 0;
            b.lastX = b.x;
            b.lastY = b.y;
        }

        if (b.fallingLadder) {
            b.y += 2.45;
            if (b.y >= b.targetLadderY) {
                b.y = b.targetLadderY;
                b.fallingLadder = false;
                b.onGirder = true;
                b.vy = 0;
                b.ladderCooldown = 30;
                const speed = b.blue ? 2.35 : 1.95;
                if (Math.abs(pBottom - (b.y + b.r)) < 45) {
                    b.vx = (pCenter >= b.x ? 1 : -1) * speed;
                } else {
                    b.vx = (b.vx >= 0 ? -1 : 1) * speed;
                }
            }
        } else {
            b.x += b.vx;

            if (b.onGirder && b.currentGirder) {
                const g = b.currentGirder;
                if (b.x >= g.x1 - 2 && b.x <= g.x2 + 2) {
                    const gy = getGirderYAt(g, b.x);
                    b.y = gy - b.r;
                    b.vy = 0;

                    const slope = getGirderSlope(g);
                    const speed = b.blue ? 2.35 : 1.95;
                    if (slope > 0.01) b.vx = speed;
                    else if (slope < -0.01) b.vx = -speed;
                    else if (g.conveyor) {
                        const dir = b.vx >= 0 ? 1 : -1;
                        b.vx = dir * speed + g.conveyor * 0.65;
                    }

                    if (b.ladderCooldown <= 0) {
                        for (const lad of levelData.ladders) {
                            if (lad.broken) continue;
                            if (Math.abs(b.x - lad.x) <= 3.5 && Math.abs((b.y + b.r) - lad.topY) <= 7) {
                                const playerBelow = pBottom > lad.topY + 10;
                                const chance = playerBelow ? 0.88 : 0.58;
                                if (Math.random() < chance) {
                                    b.fallingLadder = true;
                                    b.onGirder = false;
                                    b.currentGirder = null;
                                    b.x = lad.x;
                                    b.targetLadderY = lad.bottomY - b.r;
                                    break;
                                } else {
                                    b.ladderCooldown = 22;
                                }
                            }
                        }
                    }
                } else {
                    b.onGirder = false;
                    b.currentGirder = null;
                    b.vy = 1.2;
                }
            } else {
                const prevBottom = b.y + b.r;
                b.vy = Math.min(6.5, b.vy + 0.34);
                b.y += b.vy;
                const newBottom = b.y + b.r;

                for (const g of levelData.girders) {
                    if (b.x >= g.x1 - 2 && b.x <= g.x2 + 2) {
                        const gy = getGirderYAt(g, b.x);
                        if (prevBottom <= gy + 5 && newBottom >= gy - 2) {
                            b.y = gy - b.r;
                            b.onGirder = true;
                            b.currentGirder = g;
                            b.ladderCooldown = 14;

                            if (levelData.bouncyBarrels && b.vy > 3.6) {
                                b.vy = -2.3;
                                b.onGirder = false;
                                b.currentGirder = null;
                            } else {
                                b.vy = 0;
                            }

                            const slope = getGirderSlope(g);
                            const speed = b.blue ? 2.35 : 1.95;
                            if (slope > 0.01) b.vx = speed;
                            else if (slope < -0.01) b.vx = -speed;
                            else b.vx = -b.vx;
                            break;
                        }
                    }
                }
            }

            if (b.x - b.r < 18) {
                b.x = 18 + b.r;
                b.vx = Math.abs(b.vx);
            } else if (b.x + b.r > W - 18) {
                b.x = W - 18 - b.r;
                b.vx = -Math.abs(b.vx);
            }
        }

        if (
            b.x + b.r > oilDrum.x &&
            b.x - b.r < oilDrum.x + oilDrum.w &&
            b.y + b.r > oilDrum.y &&
            b.y - b.r < oilDrum.y + oilDrum.h
        ) {
            oilDrum.litTimer = 180;
            spawnParticles(oilDrum.x + oilDrum.w / 2, oilDrum.y, '#f97316', 12);
            if (b.blue && fireEnemies.length < 4) {
                fireEnemies.push({
                    x: oilDrum.x + 3,
                    y: oilDrum.y - 14,
                    w: 18,
                    h: 18,
                    vx: oilDrum.x < W / 2 ? 1.15 : -1.15,
                    climbing: false,
                    climbDir: 0,
                    targetY: 0,
                    ladderCooldown: 45
                });
            }
            barrels.splice(i, 1);
            continue;
        }

        if (b.y > H + 15) {
            barrels.splice(i, 1);
            continue;
        }

        if (
            !b.jumpedOver &&
            !player.onGround &&
            !player.onLadder &&
            Math.abs(pCenter - b.x) < 15 &&
            pBottom < b.y - b.r &&
            (b.y - b.r) - pBottom < 50
        ) {
            b.jumpedOver = true;
            audio.playScoreBarrel();
            addScore(100, b.x, b.y - 18, '+100');
        }

        const hitBoxX = player.powerTimer > 0
            ? (player.facing === 1 ? player.x : player.x - 16)
            : player.x + 3;
        const hitBoxW = player.powerTimer > 0 ? player.w + 16 : player.w - 6;

        if (
            b.x + b.r > hitBoxX &&
            b.x - b.r < hitBoxX + hitBoxW &&
            b.y + b.r > player.y + 4 &&
            b.y - b.r < player.y + player.h - 2
        ) {
            if (player.powerTimer > 0) {
                audio.playSmash();
                spawnParticles(b.x, b.y, '#facc15', 16);
                addScore(300, b.x, b.y - 10, '¡PETRÓLEO NEUTRALIZADO! +300');
                barrels.splice(i, 1);
            } else if (player.invulnTimer <= 0) {
                triggerPlayerHit();
                return;
            }
        }
    }
}

function updateFireEnemies() {
    const pCenter = player.x + player.w / 2;
    const pBottom = player.y + player.h;

    for (let i = fireEnemies.length - 1; i >= 0; i--) {
        const f = fireEnemies[i];
        if (f.ladderCooldown > 0) f.ladderCooldown--;

        if (f.climbing) {
            f.y += f.climbDir * 1.15;
            if ((f.climbDir < 0 && f.y + f.h <= f.targetY) || (f.climbDir > 0 && f.y + f.h >= f.targetY)) {
                f.y = f.targetY - f.h;
                f.climbing = false;
                f.ladderCooldown = 70;
                f.vx = (pCenter >= f.x ? 1 : -1) * Math.abs(f.vx);
            }
        } else {
            f.x += f.vx;
            const fCenter = f.x + f.w / 2;
            const fBottom = f.y + f.h;

            let supported = false;
            for (const g of levelData.girders) {
                if (fCenter >= g.x1 + 6 && fCenter <= g.x2 - 6) {
                    const gy = getGirderYAt(g, fCenter);
                    if (Math.abs(fBottom - gy) <= 10) {
                        f.y = gy - f.h;
                        supported = true;
                        break;
                    }
                }
            }
            if (!supported) {
                f.vx = -f.vx;
                f.x += f.vx * 2;
            }

            if (f.x < 24) {
                f.x = 24;
                f.vx = Math.abs(f.vx);
            } else if (f.x + f.w > W - 24) {
                f.x = W - 24 - f.w;
                f.vx = -Math.abs(f.vx);
            }

            if (f.ladderCooldown <= 0) {
                for (const lad of levelData.ladders) {
                    if (lad.broken) continue;
                    if (Math.abs(fCenter - lad.x) < 4) {
                        if (Math.abs(fBottom - lad.bottomY) < 8 && pBottom < fBottom - 20 && Math.random() < 0.45) {
                            f.climbing = true;
                            f.climbDir = -1;
                            f.x = lad.x - f.w / 2;
                            f.targetY = lad.topY;
                            break;
                        } else if (Math.abs(fBottom - lad.topY) < 8 && pBottom > fBottom + 20 && Math.random() < 0.45) {
                            f.climbing = true;
                            f.climbDir = 1;
                            f.x = lad.x - f.w / 2;
                            f.targetY = lad.bottomY;
                            break;
                        }
                    }
                }
            }
        }

        const hitBoxX = player.powerTimer > 0
            ? (player.facing === 1 ? player.x : player.x - 16)
            : player.x + 3;
        const hitBoxW = player.powerTimer > 0 ? player.w + 16 : player.w - 6;

        if (
            f.x + f.w > hitBoxX &&
            f.x < hitBoxX + hitBoxW &&
            f.y + f.h > player.y + 4 &&
            f.y < player.y + player.h
        ) {
            if (player.powerTimer > 0) {
                audio.playSmash();
                spawnParticles(f.x + 9, f.y + 9, '#f97316', 16);
                addScore(500, f.x, f.y - 10, '¡LLAMA EXTINGUIDA! +500');
                fireEnemies.splice(i, 1);
            } else if (player.invulnTimer <= 0) {
                triggerPlayerHit();
                return;
            }
        }
    }
}

function updateSmokeEnemies() {
    for (let i = smokeEnemies.length - 1; i >= 0; i--) {
        const s = smokeEnemies[i];
        s.x += s.vx;
        if (s.x < 35 || s.x > W - 60) s.vx = -s.vx;

        const hitBoxX = player.powerTimer > 0
            ? (player.facing === 1 ? player.x : player.x - 16)
            : player.x + 3;
        const hitBoxW = player.powerTimer > 0 ? player.w + 16 : player.w - 6;

        if (
            s.x + s.w > hitBoxX &&
            s.x < hitBoxX + hitBoxW &&
            s.y + s.h > player.y + 4 &&
            s.y < player.y + player.h
        ) {
            if (player.powerTimer > 0) {
                audio.playSmash();
                spawnParticles(s.x + 12, s.y + 8, '#a3e635', 16);
                addScore(500, s.x, s.y - 10, '¡SMOG CO2 LIMPIO! +500');
                smokeEnemies.splice(i, 1);
            } else if (player.invulnTimer <= 0) {
                triggerPlayerHit();
                return;
            }
        }
    }
}

function updateDroneEnemies() {
    for (let i = droneEnemies.length - 1; i >= 0; i--) {
        const d = droneEnemies[i];
        d.x += d.vx;
        d.phase += 0.07;
        d.y = d.baseY + Math.sin(d.phase) * 10;

        if (d.x < 30 || d.x > W - 55) d.vx = -d.vx;

        const hitBoxX = player.powerTimer > 0
            ? (player.facing === 1 ? player.x : player.x - 16)
            : player.x + 3;
        const hitBoxW = player.powerTimer > 0 ? player.w + 16 : player.w - 6;

        if (
            d.x + d.w > hitBoxX &&
            d.x < hitBoxX + hitBoxW &&
            d.y + d.h > player.y + 4 &&
            d.y < player.y + player.h
        ) {
            if (player.powerTimer > 0) {
                audio.playSmash();
                spawnParticles(d.x + 11, d.y + 7, '#38bdf8', 16);
                addScore(600, d.x, d.y - 10, '¡RESIDUO RECICLADO! +600');
                droneEnemies.splice(i, 1);
            } else if (player.invulnTimer <= 0) {
                triggerPlayerHit();
                return;
            }
        }
    }
}

function updateCollectiblesAndPowerUps() {
    if (player.powerTimer > 0) player.powerTimer--;

    if (levelData.powerUps) {
        for (const p of levelData.powerUps) {
            if (!p.collected && Math.abs((player.x + player.w / 2) - p.x) < 18 && Math.abs((player.y + player.h / 2) - p.y) < 18) {
                p.collected = true;
                player.powerTimer = 320;
                audio.isPowerMode = true;
                audio.playPowerUp();
                addScore(300, p.x, p.y - 12, '¡PANEL SOLAR ODS 7! +300');
            }
        }
    }

    if (levelData.collectibles) {
        for (const c of levelData.collectibles) {
            if (!c.collected && Math.abs((player.x + player.w / 2) - c.x) < 18 && Math.abs((player.y + player.h / 2) - c.y) < 18) {
                c.collected = true;
                audio.playCollect();
                addScore(400, c.x, c.y - 12, '¡FICHA ODS! +400');
            }
        }
    }

    if (levelData.rivets) {
        for (const rv of levelData.rivets) {
            if (!rv.active && Math.abs((player.x + player.w / 2) - rv.x) < 14 && Math.abs((player.y + player.h) - rv.y) < 10) {
                rv.active = true;
                audio.playRivet();
                addScore(250, rv.x, rv.y - 12, '+250');

                // Si se activan todos los remaches/semillas, se completa el nivel
                if (levelData.rivets.every(r => r.active)) {
                    audio.playWinLevel();
                    gameState = 'LEVEL_CLEAR';
                    stateTimer = 160;
                }
            }
        }
    }
}

function updateEffects() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 0.6;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life--;
        if (pt.life <= 0) particles.splice(i, 1);
    }
}

// ----------------------------------------------------------------------------
// 8. FUNCIONES DE RENDERIZADO GRÁFICO (PIXEL ART 1981)
// ----------------------------------------------------------------------------
function draw() {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    if (gameState === 'START') {
        drawStartScreen();
        return;
    }

    if (gameState === 'LEVEL_INTRO') {
        drawLevelIntro();
        return;
    }

    if (gameState === 'GAME_OVER') {
        drawGameOverScreen();
        return;
    }

    if (gameState === 'VICTORY') {
        drawVictoryScreen();
        return;
    }

    drawHUD();
    drawGirdersAndLadders();
    drawGoalPlanet();
    drawOilDrum();
    drawPowerUps();
    drawCollectibles();
    drawVillain();
    drawBarrels();
    drawFireEnemies();
    drawSmokeEnemies();
    drawDroneEnemies();
    drawPlayer();
    drawEffects();

    if (gameState === 'LEVEL_CLEAR') {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#4ade80';
        ctx.font = '14px "Press Start 2P"';
        ctx.fillText(`¡${levelData.heightMeters} SUPERADO!`, W / 2, 220);
        ctx.fillStyle = '#facc15';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText(levelData.name, W / 2, 265);
    }
}

function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.font = '8px "Press Start 2P"';
    ctx.textAlign = 'left';
    ctx.fillText(`1UP\n${score}`, 25, 22);
    ctx.textAlign = 'center';
    ctx.fillText(`HIGH SCORE\n${highScore}`, W / 2, 22);
    ctx.textAlign = 'right';
    ctx.fillText(`BONUS\n${bonusTimer}`, W - 25, 22);

    // Vidas (mini íconos de Jumpman)
    for (let i = 0; i < lives - 1; i++) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(25 + i * 16, 32, 10, 10);
    }

    // Indicador de Nivel Actual
    ctx.textAlign = 'center';
    ctx.fillStyle = '#facc15';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText(`FASE: ${levelData.heightMeters} (${levelData.odsCode})`, W / 2, 44);
}

function drawGirdersAndLadders() {
    // Dibujar escaleras
    for (const lad of levelData.ladders) {
        ctx.strokeStyle = levelData.ladderColor;
        ctx.lineWidth = 2;
        const top = lad.topY;
        const bot = lad.bottomY;

        if (lad.broken) {
            ctx.strokeRect(lad.x - 5, top, 10, (bot - top) / 2 - 4);
            ctx.strokeRect(lad.x - 5, top + (bot - top) / 2 + 4, 10, (bot - top) / 2 - 4);
        } else {
            ctx.strokeRect(lad.x - 6, top, 12, bot - top);
            for (let y = top + 6; y < bot; y += 8) {
                ctx.beginPath();
                ctx.moveTo(lad.x - 6, y);
                ctx.lineTo(lad.x + 6, y);
                ctx.stroke();
            }
        }
    }

    // Dibujar remaches o semillas verdes si el nivel los tiene
    if (levelData.rivets) {
        for (const rv of levelData.rivets) {
            ctx.fillStyle = rv.active ? '#1e293b' : '#4ade80';
            ctx.fillRect(rv.x - 7, rv.y - 4, 14, 8);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(rv.x - 7, rv.y - 4, 14, 8);
        }
    }

    // Dibujar vigas inclinadas clásicas de 1981 con reticulado en zigzag
    for (const g of levelData.girders) {
        ctx.strokeStyle = levelData.beamColor;
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y1);
        ctx.lineTo(g.x2, g.y2);
        ctx.stroke();

        ctx.strokeStyle = levelData.beamHighlight;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(g.x1, g.y1 - 3);
        ctx.lineTo(g.x2, g.y2 - 3);
        ctx.stroke();

        // Si es una cinta transportadora, dibujar flechas animadas
        if (g.conveyor) {
            const shift = Math.floor(frameCount / 6) % 12;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            const length = Math.hypot(g.x2 - g.x1, g.y2 - g.y1);
            const dx = (g.x2 - g.x1) / length;
            const dy = (g.y2 - g.y1) / length;

            for (let d = shift; d < length; d += 24) {
                const cx = g.x1 + dx * d;
                const cy = g.y1 + dy * d;
                ctx.beginPath();
                ctx.moveTo(cx - 3 * dx, cy - 3 * dy);
                ctx.lineTo(cx + 3 * dx, cy + 3 * dy);
                ctx.stroke();
            }
        }
    }
}

function drawGoalPlanet() {
    const gx = levelData.goalPos.x;
    const gy = levelData.goalPos.y;

    // Rueda ODS / Planeta Tierra Superior
    ctx.fillStyle = '#0284c7';
    ctx.beginPath();
    ctx.arc(gx, gy, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Continentes verdes estilizados
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(gx - 8, gy - 6, 8, 6);
    ctx.fillRect(gx + 2, gy + 2, 7, 7);

    // Corazón u ODS centrado
    ctx.fillStyle = '#facc15';
    ctx.font = '7px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('ODS', gx, gy + 3);
}

function drawVillain() {
    const vx = levelData.villainPos.x;
    const vy = levelData.villainPos.y;

    // Gorila arcade 1981 en pixel art clásico marrón/naranja
    ctx.fillStyle = '#7c2d12';
    ctx.fillRect(vx, vy, 42, 38);

    ctx.fillStyle = '#fdba74';
    ctx.fillRect(vx + 6, vy + 8, 30, 22);

    // Ojos y cejas enojadas
    ctx.fillStyle = '#000000';
    ctx.fillRect(vx + 9, vy + 12, 6, 6);
    ctx.fillRect(vx + 27, vy + 12, 6, 6);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(vx + 11, vy + 14, 2, 2);
    ctx.fillRect(vx + 29, vy + 14, 2, 2);

    // Brazos según estado de lanzamiento
    if (villainState === 'THROWING') {
        ctx.fillStyle = '#7c2d12';
        ctx.fillRect(vx - 14, vy + 14, 16, 12);
        ctx.fillRect(vx + 40, vy + 14, 16, 12);
    } else {
        ctx.fillStyle = '#7c2d12';
        ctx.fillRect(vx - 8, vy + 20, 10, 16);
        ctx.fillRect(vx + 40, vy + 20, 10, 16);
    }

    if (vx < 120) {
        ctx.fillStyle = '#18181b';
        ctx.fillRect(vx - 38, vy + 28, 16, 22);
        ctx.fillRect(vx - 20, vy + 28, 16, 22);
        ctx.strokeStyle = '#71717a';
        ctx.lineWidth = 1;
        ctx.strokeRect(vx - 38, vy + 28, 16, 22);
        ctx.strokeRect(vx - 20, vy + 28, 16, 22);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(vx - 38, vy + 33, 16, 3);
        ctx.fillRect(vx - 20, vy + 33, 16, 3);
    }
}

function drawOilDrum() {
    const dx = oilDrum.x;
    const dy = oilDrum.y;

    ctx.fillStyle = '#1e293b';
    ctx.fillRect(dx, dy, oilDrum.w, oilDrum.h);
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(dx, dy, oilDrum.w, oilDrum.h);

    ctx.fillStyle = '#facc15';
    ctx.fillRect(dx, dy + 8, oilDrum.w, 2);
    ctx.fillRect(dx, dy + 22, oilDrum.w, 2);
    ctx.fillStyle = '#ffffff';
    ctx.font = '6px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText('OIL', dx + oilDrum.w / 2, dy + 18);

    if (oilDrum.litTimer > 0) {
        const flicker = Math.floor(frameCount / 5) % 2;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(dx + 3, dy - 10 - flicker * 2, 18, 10 + flicker * 2);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(dx + 6, dy - 7 - flicker * 2, 12, 7 + flicker * 2);
    }
}

function drawBarrels() {
    for (const b of barrels) {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rot);

        ctx.fillStyle = b.blue ? '#1e3a8a' : '#18181b';
        ctx.beginPath();
        ctx.arc(0, 0, b.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = b.blue ? '#38bdf8' : '#a1a1aa';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = b.blue ? '#7dd3fc' : '#facc15';
        ctx.fillRect(-7, -3, 14, 6);

        ctx.fillStyle = '#000000';
        ctx.fillRect(-2, -2, 4, 4);

        ctx.restore();
    }
}

function drawFireEnemies() {
    for (const f of fireEnemies) {
        const flicker = Math.floor(frameCount / 6) % 2;
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(f.x + 2, f.y + 4, 14, 14);
        ctx.fillRect(f.x + (flicker ? 3 : 5), f.y, 4, 5);
        ctx.fillRect(f.x + (flicker ? 11 : 9), f.y + 1, 4, 5);

        ctx.fillStyle = '#facc15';
        ctx.fillRect(f.x + 4, f.y + 6, 10, 10);

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(f.x + 4, f.y + 8, 4, 4);
        ctx.fillRect(f.x + 10, f.y + 8, 4, 4);
        ctx.fillStyle = '#000000';
        ctx.fillRect(f.x + 5, f.y + 9, 2, 2);
        ctx.fillRect(f.x + 11, f.y + 9, 2, 2);
    }
}

function drawSmokeEnemies() {
    for (const s of smokeEnemies) {
        const pulse = Math.sin(frameCount * 0.18) * 1.5;
        ctx.fillStyle = '#475569';
        ctx.fillRect(s.x + 4, s.y + pulse, 16, 12);
        ctx.fillRect(s.x, s.y + 4 + pulse, 24, 10);
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(s.x + 4, s.y + 2 + pulse, 12, 4);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(s.x + 6, s.y + 6 + pulse, 3, 3);
        ctx.fillRect(s.x + 15, s.y + 6 + pulse, 3, 3);
    }
}

function drawDroneEnemies() {
    for (const d of droneEnemies) {
        const prop = Math.floor(frameCount / 3) % 2 === 0;
        ctx.fillStyle = '#a855f7';
        ctx.fillRect(d.x + 4, d.y + 4, 14, 8);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(d.x + (prop ? 0 : 3), d.y + 1, prop ? 8 : 4, 2);
        ctx.fillRect(d.x + (prop ? 14 : 15), d.y + 1, prop ? 8 : 4, 2);

        ctx.fillStyle = '#ef4444';
        ctx.fillRect(d.x + 9, d.y + 6, 4, 4);
    }
}

function drawPowerUps() {
    if (!levelData.powerUps) return;
    for (const p of levelData.powerUps) {
        if (p.collected) continue;
        const pulse = Math.floor(frameCount / 10) % 2 === 0;
        ctx.fillStyle = pulse ? '#facc15' : '#f59e0b';
        ctx.fillRect(p.x - 9, p.y - 9, 18, 18);
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(p.x - 7, p.y - 7, 14, 14);
        ctx.fillStyle = '#ffffff';
        ctx.font = '6px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText('ODS7', p.x, p.y + 2);
    }
}

function drawCollectibles() {
    if (!levelData.collectibles) return;
    for (const c of levelData.collectibles) {
        if (c.collected) continue;
        const itemInfo = ODS_ITEMS_DATA[c.odsIndex % ODS_ITEMS_DATA.length];
        ctx.fillStyle = itemInfo.color;
        ctx.fillRect(c.x - 8, c.y - 8, 16, 16);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(c.x - 8, c.y - 8, 16, 16);
        ctx.fillStyle = '#ffffff';
        ctx.font = '6px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText(itemInfo.id.toString(), c.x, c.y + 2);
    }
}

function drawPlayer() {
    if (player.invulnTimer > 0 && Math.floor(frameCount / 4) % 2 === 0) return;

    const px = player.x;
    const py = player.y;

    // Cuerpo de Jumpman (Mono rojo, sombrero azul con visera)
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(px + 2, py + 8, 12, 12);

    ctx.fillStyle = '#2563eb';
    ctx.fillRect(px + (player.facing === 1 ? 8 : 2), py, 8, 5);
    ctx.fillRect(px + 3, py + 5, 10, 4);

    // Modo Martillo Solar Activo (Power Up ODS 7)
    if (player.powerTimer > 0) {
        const hammerX = player.facing === 1 ? px + 14 : px - 16;
        const hammerY = py + (Math.floor(frameCount / 4) % 2 === 0 ? 0 : -8);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(hammerX, hammerY, 14, 8);
        ctx.fillStyle = '#71717a';
        ctx.fillRect(hammerX + 5, hammerY + 8, 4, 12);
    }
}

function drawEffects() {
    for (const ft of floatingTexts) {
        ctx.fillStyle = '#facc15';
        ctx.font = '7px "Press Start 2P"';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
    }

    for (const pt of particles) {
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x, pt.y, 3, 3);
    }
}

function drawStartScreen() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#dc2626';
    ctx.font = '22px "Press Start 2P"';
    ctx.fillText('ECO KONG', W / 2, 75);

    ctx.fillStyle = '#facc15';
    ctx.font = '10px "Press Start 2P"';
    ctx.fillText('AGENDA 2030 - ARCADE ' + (new Date().getFullYear() >= 1981 ? '1981' : '1981'), W / 2, 105);

    ctx.strokeStyle = '#e11d48';
    ctx.lineWidth = 2;
    ctx.strokeRect(42, 130, W - 84, 255);

    ctx.textAlign = 'left';
    ctx.font = '8px "Press Start 2P"';

    ctx.fillStyle = '#18181b';
    ctx.beginPath();
    ctx.arc(82, 162, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a1a1aa';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#facc15';
    ctx.fillRect(76, 160, 12, 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('SALTAR OIL     = 100 PTS', 110, 166);

    ctx.fillStyle = '#facc15';
    ctx.fillRect(73, 192, 18, 18);
    ctx.fillStyle = '#1d4ed8';
    ctx.fillRect(76, 195, 12, 12);
    ctx.fillStyle = '#38bdf8';
    ctx.fillText('ENERGÍA ODS 7  = 300 PTS', 110, 205);

    ctx.fillStyle = '#22c55e';
    ctx.fillRect(73, 230, 18, 18);
    ctx.fillStyle = '#ffffff';
    ctx.fillText('FICHAS ODS     = 400 PTS', 110, 243);

    ctx.fillStyle = '#facc15';
    ctx.fillRect(76, 272, 12, 8);
    ctx.fillStyle = '#4ade80';
    ctx.fillText('NODO VERDE     = 250 PTS', 110, 280);

    ctx.textAlign = 'center';
    if (Math.floor(frameCount / 24) % 2 === 0) {
        ctx.fillStyle = '#facc15';
        ctx.font = '11px "Press Start 2P"';
        ctx.fillText('INSERT COIN', W / 2, 332);
        ctx.fillStyle = '#ffffff';
        ctx.font = '9px "Press Start 2P"';
        ctx.fillText('PULSA ESPACIO O CLICK PARA JUGAR', W / 2, 362);
    }

    ctx.fillStyle = '#38bdf8';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText('1 PLAYER   -   9 FASES ODS', W / 2, 450);
}

function drawLevelIntro() {
    const lvl = LEVELS[currentLevel % LEVELS.length];
    ctx.textAlign = 'center';

    ctx.fillStyle = '#38bdf8';
    ctx.font = '11px "Press Start 2P"';
    ctx.fillText('HOW HIGH CAN YOU GET ?', W / 2, 75);

    const startIdx = Math.max(0, currentLevel - 4);
    for (let i = startIdx; i <= currentLevel; i++) {
        const row = i - startIdx;
        const yPos = 385 - row * 52;
        const itemLvl = LEVELS[i % LEVELS.length];
        const isCurrent = (i === currentLevel);

        ctx.textAlign = 'right';
        ctx.fillStyle = isCurrent ? '#facc15' : '#94a3b8';
        ctx.font = '10px "Press Start 2P"';
        ctx.fillText(itemLvl.heightMeters, 155, yPos);

        if (isCurrent) {
            ctx.fillStyle = '#9a3412';
            ctx.fillRect(175, yPos - 26, 32, 26);
            ctx.fillStyle = '#fdba74';
            ctx.fillRect(181, yPos - 22, 20, 12);
        } else {
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(184, yPos - 14, 14, 12);
        }

        ctx.textAlign = 'left';
        ctx.fillStyle = isCurrent ? '#4ade80' : '#64748b';
        ctx.font = '7px "Press Start 2P"';
        ctx.fillText(`${itemLvl.odsCode}: ${itemLvl.name.slice(0, 20)}`, 220, yPos - 4);
    }

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff79c6';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText(lvl.subtitle, W / 2, 465);
}

function drawGameOverScreen() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff2a2a';
    ctx.font = '22px "Press Start 2P"';
    ctx.fillText('GAME OVER', W / 2, 195);

    ctx.fillStyle = '#ffffff';
    ctx.font = '10px "Press Start 2P"';
    ctx.fillText(`FINAL SCORE: ${score}`, W / 2, 245);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '8px "Press Start 2P"';
    ctx.fillText(`ALTURA ALCANZADA: ${LEVELS[currentLevel % LEVELS.length].heightMeters}`, W / 2, 280);

    if (Math.floor(frameCount / 24) % 2 === 0) {
        ctx.fillStyle = '#facc15';
        ctx.font = '9px "Press Start 2P"';
        ctx.fillText('PULSA ESPACIO O CLICK PARA REINTENTAR', W / 2, 375);
    }
}

function drawVictoryScreen() {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4ade80';
    ctx.font = '16px "Press Start 2P"';
    ctx.fillText('¡225m COMPLETADOS!', W / 2, 125);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '10px "Press Start 2P"';
    ctx.fillText('AGENDA 2030 CUMPLIDA', W / 2, 160);

    ctx.fillStyle = '#facc15';
    ctx.font = '11px "Press Start 2P"';
    ctx.fillText(`SCORE FINAL: ${score}`, W / 2, 205);

    ctx.strokeStyle = '#e11d48';
    ctx.lineWidth = 2;
    ctx.strokeRect(35, 235, W - 70, 130);
    ctx.fillStyle = '#ffffff';
    ctx.font = '7px "Press Start 2P"';
    ctx.fillText('HAS SUPERADO LOS 9 DESAFÍOS', W / 2, 268);
    ctx.fillText('DE DESARROLLO SOSTENIBLE:', W / 2, 291);
    ctx.fillText('CLIMA, AGUA, ENERGÍA Y PAZ.', W / 2, 314);
    ctx.fillStyle = '#4ade80';
    ctx.fillText('¡FELICIDADES, HÉROE ECO!', W / 2, 344);

    if (Math.floor(frameCount / 24) % 2 === 0) {
        ctx.fillStyle = '#facc15';
        ctx.font = '9px "Press Start 2P"';
        ctx.fillText('PULSA ESPACIO O CLICK PARA JUGAR DE NUEVO', W / 2, 420);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

window.onload = function() {
    gameLoop();
};
</script>
</body>
</html>
